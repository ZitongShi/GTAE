[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtae"
version = "0.1.0"
description = "GTAE and STRUM for text-attributed federated graph learning"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torch-geometric>=2.5",
  "transformers>=4.43",
  "sentence-transformers>=3.0",
  "ogb>=1.3.6",
  "networkx>=3.2",
  "nltk>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "tqdm>=4.66"
]

[tool.setuptools.packages.find]
include = ["gtae*"]

